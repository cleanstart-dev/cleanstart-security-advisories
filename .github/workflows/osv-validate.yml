name: OSV JSON Validator

on:
  pull_request:
    paths:
      - "**/*.json"

jobs:
  validate-osv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JSON schema validator
        run: |
          pip install check-jsonschema

      - name: Validate changed OSV JSON files
        run: |
          SCHEMA_URL="https://raw.githubusercontent.com/ossf/osv-schema/main/validation/schema.json"

          # Only get ADDED or MODIFIED files in THIS PR (three-dot diff avoids race condition
          # where concurrent PR merges add files to main that aren't in the current branch)
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- | grep \.json$ || true)

          if [ -z "$files" ]; then
            echo "No JSON files changed. Skipping validation."
            exit 0
          fi

          echo "Using schema: $SCHEMA_URL"

          # Validate only files that exist in the current checkout
          for file in $files; do
            if [ -f "$file" ]; then
              echo "Validating: $file"
              check-jsonschema --schemafile "$SCHEMA_URL" "$file"
            else
              echo "Skipping (not in this branch): $file"
            fi
          done
